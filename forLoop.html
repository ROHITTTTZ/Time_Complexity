<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="forLoop.css">
    <title>Simple For Loop</title>
</head>
<body>
    <div class="container1">
        <div class="algorithm">
            <pre class="algo">
            for(<span class="initialize">i=0</span>; <span class="condition">i&lt;n</span>; <span class="updation">i++</span>){
                <div class="statement">
                statement;
                </div>

            }
            </pre>
        </div>
        <div class="table">
            Current Value of i
            <form id="inputForm">
                <input type="number" id="nInput" placeholder="Enter value of n">
                <input type="submit" value="Animate" name="submit">
            </form>
        </div>
    </div>
    <div class="time-complexity">
        Time Complexity
    </div>
    <script src="forLoop.js"></script>
</body>
</html>
